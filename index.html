<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Data Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 flex justify-between items-center hidden" id="navbar">
        <h1 class="text-xl font-bold">Portal Data Siswa</h1>
        <div class="flex items-center gap-4">
            <span id="userEmail" class="text-sm"></span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-700 px-4 py-2 rounded text-sm font-bold">Logout</button>
        </div>
    </nav>

    <!-- Halaman Login -->
    <div id="loginSection" class="flex justify-center items-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Login Sistem</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm mb-2">Email</label>
                    <input type="email" id="email" class="w-full border p-2 rounded focus:outline-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm mb-2">Password</label>
                    <input type="password" id="password" class="w-full border p-2 rounded focus:outline-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">Masuk</button>
                <p id="loginError" class="text-red-500 text-sm mt-3 text-center hidden"></p>
            </form>
        </div>
    </div>

    <!-- Halaman Utama (Dashboard) -->
    <div id="dashboardSection" class="max-w-5xl mx-auto p-6 hidden">
        
        <!-- Form Admin (Hanya muncul jika admin login) -->
        <div id="adminPanel" class="bg-white p-6 rounded-lg shadow-md mb-6 hidden">
            <h3 class="text-lg font-bold mb-4" id="formTitle">Tambah Data Siswa</h3>
            <form id="studentForm" onsubmit="handleSaveData(event)" class="flex gap-4">
                <input type="hidden" id="studentId">
                <input type="text" id="nis" placeholder="NIS" class="border p-2 rounded w-1/4" required>
                <input type="text" id="nama" placeholder="Nama Lengkap" class="border p-2 rounded w-2/4" required>
                <input type="text" id="kelas" placeholder="Kelas" class="border p-2 rounded w-1/4" required>
                <button type="submit" class="bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600 font-bold">Simpan</button>
            </form>
        </div>

        <!-- Tabel Data Siswa (Bisa dilihat Admin & Siswa) -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h3 class="text-lg font-bold mb-4">Daftar Siswa</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-3 border">NIS</th>
                            <th class="p-3 border">Nama Lengkap</th>
                            <th class="p-3 border">Kelas</th>
                            <th class="p-3 border w-32 admin-action hidden">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <!-- Data render di sini via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
